name: Dev Pipeline

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    # TODO uncomment this for dev
    # paths:
    #   - 'common/**'
    #   - 'services/**'
    #   - 'frontend/**'
    #   - 'k8s-chatbot/**'
    #   - '**/Dockerfile'
    #   - '**/Dockerfile.*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      
      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: |
          ruff check common services --ignore E501 2>/dev/null || true
          ruff check k8s-chatbot/backend --ignore E501 2>/dev/null || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r common/requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run tests
        run: pytest -q tests/

  sast-trivy:
    name: SAST (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          # Set to '1' to block merge when vulnerabilities are found
          exit-code: '1'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
