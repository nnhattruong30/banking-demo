name: Dev Pipeline

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    # TODO uncomment this for dev
    # paths:
    #   - 'common/**'
    #   - 'services/**'
    #   - 'frontend/**'
    #   - 'k8s-chatbot/**'
    #   - '**/Dockerfile'
    #   - '**/Dockerfile.*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      
      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: |
          ruff check common services --ignore E501 2>/dev/null || true
          ruff check k8s-chatbot/backend --ignore E501 2>/dev/null || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r common/requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run tests
        run: pytest -q tests/

  sast-trivy:
    name: SAST (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          # Set to '1' to block merge when vulnerabilities are found
          exit-code: '0'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

  sast-bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit scan
        id: bandit
        run: |
          bandit -r common services k8s-chatbot/backend \
            -s HIGH -f txt 2>&1 | tee bandit-report.txt
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.txt

  dep-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        id: audit
        run: |
          # pip-audit exits 1 when vulnerabilities found -> block merge
          pip-audit -r common/requirements.txt \
            -r k8s-chatbot/backend/requirements.txt 2>&1 | tee audit-report.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.txt

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect \
            --source /path --report-path /path/secrets-report.json --report-format json 2>&1 | tee secrets-report.txt
          [ -f secrets-report.json ] && cat secrets-report.json >> secrets-report.txt
          [ ! -s secrets-report.json ] && echo "No secrets detected" > secrets-report.txt
          # Gitleaks exits 1 when leaks found -> Block merge

      - name: Upload secrets report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-report
          path: secrets-report.txt

