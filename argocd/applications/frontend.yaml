# Frontend Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-demo-frontend
  namespace: argocd
  labels:
    app.kubernetes.io/name: banking-demo
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # Deploy sau microservices (frontend)
spec:
  project: default
  source:
    repoURL: https://github.com/nnhattruong30/banking-demo.git
    targetRevision: feat/my-custom
    path: helm
    helm:
      releaseName: banking-demo-frontend
      valueFiles:
        - charts/common/values.yaml
        - charts/frontend/values.yaml
      parameters:
        # QUAN TRỌNG: Disable namespace và secret để tránh conflict
        - name: namespace.enabled
          value: "false"  # Namespace đã được tạo bởi namespace.yaml
        - name: secret.enabled
          value: "false"  # Secret đã được tạo bởi namespace.yaml
        - name: postgres.enabled
          value: "false"
        - name: redis.enabled
          value: "false"
        - name: kong.enabled
          value: "false"
        - name: auth-service.enabled
          value: "false"
        - name: account-service.enabled
          value: "false"
        - name: transfer-service.enabled
          value: "false"
        - name: notification-service.enabled
          value: "false"
        - name: frontend.enabled
          value: "true"
        - name: ingress.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
